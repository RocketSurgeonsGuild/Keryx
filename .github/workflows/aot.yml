name: Native AOT

# Publishes every sample host (samples/hosts/*/*.csproj) with Native AOT for each target framework and fails on any trim or AOT
# warning (IL2xxx/IL3xxx), which the repository's warnings-as-errors policy promotes. Until the sample hosts exist (ADR 0001,
# phase 7) the job finds none and does nothing.
on:
    push:
        branches:
            - main
            - next
    pull_request:
        branches:
            - main
            - next
    merge_group:
        branches:
            - main
            - next

permissions:
    contents: read

concurrency:
    group: aot-${{ github.event_name }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: '0'
            - name: 🔎 Find sample hosts
              id: hosts
              run: |
                  shopt -s nullglob
                  hosts=(samples/hosts/*/*.csproj)
                  echo "count=${#hosts[@]}" >> "$GITHUB_OUTPUT"
                  if [ ${#hosts[@]} -eq 0 ]; then
                      echo "::notice title=Native AOT::No sample hosts yet; nothing to publish."
                  fi
            - name: 🛠️ Setup mise
              if: steps.hosts.outputs.count != '0'
              uses: jdx/mise-action@v5
              env:
                  MISE_JOBS: '1'
              with:
                  install: true
                  install_args: dotnet
                  cache: true
                  cache_save: false
                  experimental: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}
            - name: ⚙️ Publish hosts (Native AOT)
              if: steps.hosts.outputs.count != '0'
              run: |
                  shopt -s nullglob
                  for host in samples/hosts/*/*.csproj; do
                      for framework in net10.0 net11.0; do
                          dotnet publish "$host" -c Release -f "$framework" -p:PublishAot=true -p:TreatWarningsAsErrors=true -p:TrimmerSingleWarn=false --disable-build-servers
                      done
                  done
