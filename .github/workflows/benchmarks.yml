name: Benchmarks

# Builds the BenchmarkDotNet suite (test/Keryx.Benchmarks), checks that every comparison subject really runs each scenario's handlers and
# behaviors (--verify), and runs every benchmark once with the Dry job, so a benchmark that no longer builds or throws fails the pull
# request. Numbers are never published from shared runners (ADR 0001, Benchmarks); the README's results come from a local run.
on:
    push:
        branches:
            - main
            - next
    pull_request:
        branches:
            - main
            - next
    merge_group:
        branches:
            - main
            - next

permissions:
    contents: read

concurrency:
    group: benchmarks-${{ github.event_name }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    dry:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: '0'
            - name: 🛠️ Setup mise
              uses: jdx/mise-action@v5
              env:
                  MISE_JOBS: '1'
              with:
                  install: true
                  install_args: dotnet
                  cache: true
                  cache_save: false
                  experimental: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}
            - name: ⚙️ Build benchmarks
              run: dotnet build test/Keryx.Benchmarks/Keryx.Benchmarks.csproj -c Release -f net10.0 --disable-build-servers
            - name: 🔎 Verify comparison subjects
              working-directory: test/Keryx.Benchmarks
              run: dotnet run -c Release -f net10.0 --no-build -- --verify
            - name: 🏃 Run benchmarks (Dry job)
              working-directory: test/Keryx.Benchmarks
              run: dotnet run -c Release -f net10.0 --no-build -- --filter '*' --job Dry --artifacts "$RUNNER_TEMP/benchmarks"
